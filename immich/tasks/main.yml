---
# tasks file for caddy

- name: Add Docker repository signature
  ansible.builtin.apt_key:
    url: "https://download.docker.com/linux/debian/gpg"
    state: present

- name: Add Docker repository to sources list
  ansible.builtin.apt_repository:
    repo:
      "deb https://download.docker.com/linux/debian
      bookworm stable"
    state: present

# Use an existing mount (e.g. /mnt/HC_Volume_106913471) as the rclone VFS cache dir
- name: Use existing mount as rclone VFS cache dir if present
  ansible.builtin.set_fact:
    rclone_vfs_cache_dir: "{{ rclone_vfs_cache_path | regex_replace('/+$', '') }}"
  when: >
    ansible_facts['mounts'] | selectattr('mount', 'equalto',
    rclone_vfs_cache_path | regex_replace('/+$', '')) | list | length > 0

- name: Fallback to default rclone VFS cache dir
  ansible.builtin.set_fact:
    rclone_vfs_cache_dir: "{{ rclone_vfs_cache_dir_default }}"
  when: rclone_vfs_cache_dir is not defined

- name: Create rclone VFS cache directory
  become: true
  ansible.builtin.file:
    path: "{{ rclone_vfs_cache_dir }}"
    state: directory
    mode: '0755'

- name: Install required packages
  ansible.builtin.apt:
    update_cache: true
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - rclone
      - fuse
    state: present

# Info rclone mount https://rclone.org/commands/rclone_mount/
- name: Setup rclone config
  become: true
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: "{{ rclone_conf_path }}"
    owner: root
    group: root
    mode: '0644'

- name: Create mount directory
  ansible.builtin.file:
    path: /mnt/storagebox
    state: directory
    mode: '0755'

# Lien symbolique pour mount ln -s /usr/bin/rclone /sbin/mount.rclone
- name: Create symbolic link for rclone
  ansible.builtin.file:
    src: /usr/bin/rclone
    dest: /sbin/mount.rclone
    owner: root
    group: media
    state: link

# ajout mount
- name: Template mount file
  become: true
  ansible.builtin.template:
    src: mnt-storagebox.mount.j2
    dest: "{{ mount_file_path }}mnt-storagebox.mount"
    owner: root
    group: root
    mode: '0644'

# ajout mount
- name: Copy mount file
  become: true
  ansible.builtin.copy:
    src: mnt-storagebox.automount
    dest: "{{ mount_file_path }}mnt-storagebox.automount"
    owner: root
    group: root
    mode: '0644'

- name: Reload to systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Enable automount
  ansible.builtin.systemd_service:
    enabled: true
    name: mnt-storagebox.automount

- name: Start mount service
  ansible.builtin.systemd_service:
    state: started
    name: mnt-storagebox.mount

# Copy docker files
- name: Copy immich repo
  become: true
  ansible.builtin.copy:
    src: immich/docker-compose.yml
    dest: "{{ dockge_base_folder }}immich/docker-compose.yml"
    owner: root
    group: root
    mode: '0644'

- name: Copy Immich .env
  become: true
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ dockge_base_folder }}immich/.env"
    owner: root
    group: root
    mode: '0644'

# Start
- name: Create and start Immich via docker-compose
  community.docker.docker_compose_v2:
    project_src: "{{ dockge_base_folder }}immich"
