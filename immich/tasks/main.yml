---
# tasks file for caddy

- name: Add Docker repository signature
  ansible.builtin.apt_key:
    url: "https://download.docker.com/linux/debian/gpg"
    state: present

- name: Add Docker repository to sources list
  ansible.builtin.apt_repository:
    repo:
      "deb https://download.docker.com/linux/debian
      bookworm stable"
    state: present

# Use an existing mount (e.g. /mnt/HC_Volume_106913471) as the rclone VFS cache dir
- name: Use existing mount as rclone VFS cache dir if present
  ansible.builtin.set_fact:
    rclone_vfs_cache_dir: "{{ rclone_vfs_cache_path | regex_replace('/+$', '') }}"
  when: >
    ansible_facts['mounts'] | selectattr('mount', 'equalto',
    rclone_vfs_cache_path | regex_replace('/+$', '')) | list | length > 0

- name: Fallback to default rclone VFS cache dir
  ansible.builtin.set_fact:
    rclone_vfs_cache_dir: "{{ rclone_vfs_cache_dir_default }}"
  when: rclone_vfs_cache_dir is not defined

- name: Create rclone VFS cache directory
  become: true
  ansible.builtin.file:
    path: "{{ rclone_vfs_cache_dir }}"
    state: directory
    mode: '0755'

- name: Install required packages
  ansible.builtin.apt:
    update_cache: true
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - rclone
      - fuse
    state: present

# Info rclone mount https://rclone.org/commands/rclone_mount/
- name: Setup rclone config
  become: true
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: "{{ rclone_conf_path }}"
    owner: root
    group: root
    mode: '0644'

- name: Create mount directory
  ansible.builtin.file:
    path: /mnt/storagebox
    state: directory
    mode: '0755'

# Lien /sbin/mount.rclone : il ne servait qu'a l'ancienne unite .mount
- name: Supprime l'ancien lien mount.rclone
  ansible.builtin.file:
    path: /sbin/mount.rclone
    state: absent

# Etat des anciennes unites (.mount + .automount) remplacees par un service
- name: Verifie la presence des anciennes unites mount/automount
  ansible.builtin.stat:
    path: "{{ mount_file_path }}mnt-storagebox.{{ item }}"
  loop:
    - mount
    - automount
  register: anciennes_unites_mount

# Un .mount ne peut pas se relancer seul : on arrete les anciennes unites avant
# de les supprimer, sinon rclone garderait le point de montage occupe
- name: Arrete et desactive les anciennes unites mount/automount
  ansible.builtin.systemd_service:
    name: "mnt-storagebox.{{ item.item }}"
    state: stopped
    enabled: false
  loop: "{{ anciennes_unites_mount.results }}"
  loop_control:
    label: "mnt-storagebox.{{ item.item }}"
  when: item.stat.exists

- name: Supprime les anciennes unites mount/automount
  ansible.builtin.file:
    path: "{{ mount_file_path }}mnt-storagebox.{{ item.item }}"
    state: absent
  loop: "{{ anciennes_unites_mount.results }}"
  loop_control:
    label: "mnt-storagebox.{{ item.item }}"
  when: item.stat.exists

- name: Template rclone mount service
  become: true
  ansible.builtin.template:
    src: mnt-storagebox.service.j2
    dest: "{{ mount_file_path }}mnt-storagebox.service"
    owner: root
    group: root
    mode: '0644'
  notify: Redemarrer le montage rclone

- name: Reload to systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# Restart=always dans l'unite : systemd relance rclone si le SFTP tombe
- name: Active et demarre le montage rclone
  ansible.builtin.systemd_service:
    name: mnt-storagebox.service
    enabled: true
    state: started

# Copy docker files
- name: Copy immich repo
  become: true
  ansible.builtin.copy:
    src: immich/docker-compose.yml
    dest: "{{ dockge_base_folder }}immich/docker-compose.yml"
    owner: root
    group: root
    mode: '0644'

- name: Copy Immich .env
  become: true
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ dockge_base_folder }}immich/.env"
    owner: root
    group: root
    mode: '0644'

# Start
- name: Create and start Immich via docker-compose
  community.docker.docker_compose_v2:
    project_src: "{{ dockge_base_folder }}immich"
