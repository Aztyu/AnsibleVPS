---
# tasks file for jellyfin

- name: Create mnt media
  ansible.builtin.file:
    path: /mnt/storagebox/media
    state: directory
    mode: '0755'

- name: Create Jellyfin directory
  ansible.builtin.file:
    path: "{{ dockge_base_folder }}jellyfin"
    state: directory
    mode: '0755'

- name: Setup Jellyfin docker compose
  become: true
  ansible.builtin.template:
    src: jellyfin/docker-compose.yml.j2
    dest: "{{ dockge_base_folder }}jellyfin/docker-compose.yml"
    owner: root
    group: root
    mode: '0644'

- name: Create and start Jellyfin via docker-compose
  community.docker.docker_compose_v2:
    project_src: "{{ dockge_base_folder }}jellyfin/"

- name: Setup jellyseer docker compose
  become: true
  ansible.builtin.template:
    src: jellyseer/docker-compose.yml.j2
    dest: "{{ dockge_base_folder }}jellyseer/docker-compose.yml"
    owner: root
    group: root
    mode: '0644'

- name: Create and start jellyseer via docker-compose
  community.docker.docker_compose_v2:
    project_src: "{{ dockge_base_folder }}jellyseer/"

- name: Download Sonarr
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/Sonarr/Sonarr/develop/distribution/debian/install.sh
    dest: /home/cloud/
    mode: '0644'

- name: Set permissions
  ansible.builtin.file:
    path: /home/cloud/install.sh
    mode: '0755'

- name: Pré-requis Sonarr / Radarr
  ansible.builtin.apt:
    update_cache: true
    name:
      - python3-pip
      - python3-pexpect
      - curl
      - sqlite3

- name: Run install
  ansible.builtin.expect:
    command: /home/cloud/install.sh
    responses:
      'What user should Sonarr run as':
        - 'cloud'
      'What group should Sonarr run as':
        - 'media'
      'Press enter to continue':
        - ''

- name: Restart Sonarr to apply update
  ansible.builtin.systemd_service:
    state: restarted
    daemon_reload: true
    name: sonarr

- name: Create Radarr file
  ansible.builtin.file:
    path: /var/lib/radarr
    owner: cloud
    group: media
    state: directory
    mode: '0755'

- name: Unarchive Radarr
  ansible.builtin.unarchive:
    src: http://radarr.servarr.com/v1/update/master/updatefile?os=linux&runtime=netcore&arch=arm64
    dest: /opt/
    owner: cloud
    group: media
    remote_src: true

- name: Copy Radarr.service
  become: true
  ansible.builtin.copy:
    src: Radarr/radarr.service
    dest: /etc/systemd/system/
    owner: cloud
    group: media
    mode: '0644'

- name: Start Radarr
  ansible.builtin.systemd_service:
    state: restarted
    daemon_reload: true
    name: radarr

- name: Setup Yamstack .env
  become: true
  ansible.builtin.copy:
    src: yamstack/.env
    dest: "{{ dockge_base_folder }}yamstack/.env"
    owner: root
    group: root
    mode: '0644'

- name: Setup Yamstack docker compose
  become: true
  ansible.builtin.template:
    src: yamstack/docker-compose.yml.j2
    dest: "{{ dockge_base_folder }}yamstack/docker-compose.yml"
    owner: root
    group: root
    mode: '0644'

- name: Create and start Yamstack via docker-compose
  community.docker.docker_compose_v2:
    project_src: "{{ dockge_base_folder }}yamstack/"

- name: Create torrent-stack data directory
  ansible.builtin.file:
    path: "{{ dockge_base_folder }}torrent-stack"
    state: directory
    mode: '0755'

- name: Create transmission-gluetun config directory
  become: true
  ansible.builtin.file:
    path: "{{ dockge_base_folder }}transmission-gluetun/config"
    state: directory
    owner: root
    group: root
    mode: '0755'

# Le conteneur écrit avec PUID/PGID 1000 et l'image LSIO ne chown que /config :
# le dossier doit rester accessible en écriture pour l'utilisateur non-root.
- name: Create transmission-gluetun incomplete directory
  become: true
  ansible.builtin.file:
    path: "{{ dockge_base_folder }}transmission-gluetun/incomplete"
    state: directory
    owner: root
    group: root
    mode: '0777'

# Le démon tourne avec `-g /config` : sa configuration réelle est /config/settings.json
# (et non /config/transmission-home/settings.json, qui n'est plus lu).
# Transmission réécrit ce fichier à chaque arrêt : on stoppe le conteneur avant
# d'écrire pour qu'il relise notre version au démarrage (relancé par le compose up).
- name: Compute desired transmission-gluetun settings checksum
  ansible.builtin.set_fact:
    transmission_settings_checksum: "{{ lookup('file', role_path ~ '/files/transmission-gluetun/config/settings.json') | hash('sha1') }}"

- name: Check current transmission-gluetun settings
  ansible.builtin.stat:
    path: "{{ dockge_base_folder }}transmission-gluetun/config/settings.json"
  register: transmission_settings

- name: Get transmission container state
  community.docker.docker_container_info:
    name: transmission
  register: transmission_container

- name: Stop transmission-gluetun before applying settings
  community.docker.docker_container:
    name: transmission
    state: stopped
  when:
    - transmission_container.exists
    - transmission_container.container.State.Running
    - not transmission_settings.stat.exists or transmission_settings.stat.checksum != transmission_settings_checksum

- name: Setup transmission-gluetun settings
  become: true
  ansible.builtin.copy:
    src: transmission-gluetun/config/settings.json
    dest: "{{ dockge_base_folder }}transmission-gluetun/config/settings.json"
    owner: '1000'
    group: '1000'
    mode: '0644'

- name: Setup torrent-stack docker compose
  become: true
  ansible.builtin.template:
    src: torrent-stack/docker-compose.yml.j2
    dest: "{{ dockge_base_folder }}torrent-stack/docker-compose.yml"
    owner: root
    group: root
    mode: '0644'

- name: Create and start torrent-stack via docker-compose
  community.docker.docker_compose_v2:
    project_src: "{{ dockge_base_folder }}torrent-stack/"
