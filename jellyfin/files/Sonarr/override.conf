# Drop-in systemd pour Sonarr.
#
# L'unite /etc/systemd/system/sonarr.service est generee par l'install.sh officiel
# (Sonarr/Sonarr, distribution/debian/install.sh) : elle n'est pas versionnee ici et
# serait ecrasee a chaque execution. Il ne supprime que le .service, pas le dossier
# .d/ : on surcharge donc via ce drop-in, qui survit aux mises a jour.
#
# - network-online : Sonarr doit pouvoir joindre les indexers/notifications au demarrage
# - mnt-storagebox : la bibliotheque vit sous /mnt/storagebox (montage rclone)
# Meme chose que jellyfin/files/Radarr/radarr.service.
[Unit]
After=syslog.target network-online.target mnt-storagebox.service
Wants=network-online.target
